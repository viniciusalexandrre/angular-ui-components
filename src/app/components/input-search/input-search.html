<div class="input-search">
  <input
    [value]="query()"
    type="search"
    [placeholder]="placeholder()"
    [id]="id()"
    (input)="searchQuery.emit($any($event.target.value))"
  />
  <button>
    <img ngSrc="button/icon-search.svg" height="12" width="12" alt="ícone de pesquisa" />
  </button>
</div>
