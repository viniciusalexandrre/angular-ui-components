<header class="topbar">
  <a class="brand" routerLink="/">reusable-union-kit <span>showcase</span></a>
  <ui-theme-toggle />
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Cenários">
    <ul>
      @for (cenario of cenarios; track cenario.path) {
        <li>
          <a
            [routerLink]="['/cenarios', cenario.path]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            <strong>{{ cenario.titulo }}</strong>
            <small>{{ cenario.descricao }}</small>
          </a>
        </li>
      }
    </ul>
  </nav>

  <main class="content">
    <ui-breadcrumb />
    <router-outlet />
  </main>
</div>
