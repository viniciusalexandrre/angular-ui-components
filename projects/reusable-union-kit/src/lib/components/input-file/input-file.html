<ui-field
  [id]="id()"
  [label]="label() || ''"
  [hint]="hint()"
  [required]="required()"
  [errors]="errors()"
  [showErrors]="showErrors()"
>
  <div
    class="file"
    [class.is-invalid]="showErrors()"
    [class.is-dragging]="isDragging()"
    [class.is-disabled]="disabled()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <label class="file-dropzone">
      <input
        class="file-input"
        type="file"
        [id]="id()"
        [name]="name()"
        [multiple]="multiple()"
        [disabled]="disabled()"
        [required]="required() && !hasFiles()"
        [attr.accept]="accept() || null"
        [attr.aria-readonly]="readonly() || null"
        [attr.aria-invalid]="showErrors()"
        [attr.aria-describedby]="describedBy()"
        (change)="handleChange($event)"
        (click)="handleClick($event)"
        (blur)="touch.emit()"
      />

      <span class="file-icon" aria-hidden="true">
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
        >
          <path d="M10 13V3M6 7l4-4 4 4" />
          <path d="M3 13v2.5A1.5 1.5 0 0 0 4.5 17h11a1.5 1.5 0 0 0 1.5-1.5V13" />
        </svg>
      </span>

      @if (hasFiles() && multiple()) {
        <span class="file-title">{{ selectedText()(selectedFiles().length) }}</span>
        <span class="file-description">{{ addMoreText() }}</span>
      } @else if (hasFiles()) {
        <span class="file-title">{{ selectedFiles()[0].name }}</span>
        <span class="file-description">{{ formatSize(selectedFiles()[0].size) }}</span>
      } @else {
        <span class="file-title">{{ titleText() }}</span>
        <span class="file-description">
          {{ orText() }} <strong>{{ actionText() }}</strong>
        </span>
      }
    </label>

    @if (hasFiles()) {
      <ul class="file-list" aria-live="polite">
        @for (file of selectedFiles(); track file) {
          <li>
            <span class="file-name">{{ file.name }}</span>
            <span class="file-size">{{ formatSize(file.size) }}</span>
            @if (isInteractive()) {
              <button
                class="file-remove"
                type="button"
                [attr.aria-label]="removeLabel() + ' ' + file.name"
                (click)="removeFile(file)"
              >
                <svg
                  width="10"
                  height="10"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M3 3l10 10M13 3L3 13" />
                </svg>
              </button>
            }
          </li>
        }
      </ul>
    }
  </div>
</ui-field>
