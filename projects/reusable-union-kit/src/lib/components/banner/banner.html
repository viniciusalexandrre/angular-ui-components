<section class="banner" [class.banner-with-image]="img()">
  @if (img()) {
    <div class="banner-media">
      <img
        [ngSrc]="img()"
        [alt]="imgAlt()"
        [width]="imgWidth()"
        [height]="imgHeight()"
        [priority]="imgPriority()"
      />
    </div>
  }
  <div class="banner-content">
    <div class="banner-heading">
      <h2>{{ heading() }}</h2>
      @if (subtitle()) {
        <span class="banner-subtitle">{{ subtitle() }}</span>
      }
    </div>
    @if (description()) {
      <p class="banner-description">{{ description() }}</p>
    }
    <ng-content />
    @if (buttonText()) {
      <button ui-button type="button" (click)="buttonClick.emit()">
        {{ buttonText() }}
      </button>
    }
  </div>
</section>
