<div class="checkbox" [class.checkbox-invalid]="showErrors()">
  <label class="checkbox-label" [class.checkbox-disabled]="disabled()" [for]="id()">
    <input
      class="checkbox-input"
      type="checkbox"
      [id]="id()"
      [name]="name()"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-readonly]="readonly() || null"
      [attr.aria-invalid]="showErrors()"
      [attr.aria-describedby]="describedBy()"
      (change)="handleChange($event)"
      (click)="handleClick($event)"
      (blur)="touch.emit()"
    />
    <span class="checkbox-box" aria-hidden="true">
      <svg class="icon-check" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M3 8.5l3.5 3.5L13 4.5" />
      </svg>
      <svg class="icon-dash" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" focusable="false">
        <path d="M3.5 8h9" />
      </svg>
    </span>
    <span class="checkbox-text">
      {{ label() }}
      @if (required()) {
        <span class="checkbox-required" aria-hidden="true">*</span>
      }
    </span>
  </label>

  @if (hint() && !showErrors()) {
    <small class="checkbox-hint" [id]="id() + '-hint'">{{ hint() }}</small>
  }

  @if (showErrors()) {
    <div class="checkbox-errors" [id]="id() + '-error'" role="alert">
      @for (error of errors(); track error.kind + error.message) {
        <small>{{ error.message }}</small>
      }
    </div>
  }
</div>
