<div class="field" [class.field-invalid]="showErrors()">
  <label [for]="id()">
    {{ label() }}
    @if (required()) {
      <span class="field-required" aria-hidden="true">*</span>
    }
  </label>

  <ng-content />

  @if (hint() && !showErrors()) {
    <small class="field-hint" [id]="id() + '-hint'">{{ hint() }}</small>
  }

  @if (showErrors()) {
    <div [id]="id() + '-error'" role="alert">
      @for (error of errors(); track error.kind + error.message) {
        <small>{{ error.message }}</small>
      }
    </div>
  }
</div>
