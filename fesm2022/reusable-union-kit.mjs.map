<nav class="breadcrumb" [attr.aria-label]="label()">
  <ol class="breadcrumb-list">
    @for (item of breadcrumbs(); track item.url; let last = $last) {
      <li class="breadcrumb-item">
        @if (last) {
          <span class="breadcrumb-current" aria-current="page">{{ item.label }}</span>
        } @else {
          <a class="breadcrumb-link" [routerLink]="item.url">{{ item.label }}</a>
          <span class="breadcrumb-separator" aria-hidden="true">{{ separator() }}</span>
        }
      </li>
    }
  </ol>
</nav>
