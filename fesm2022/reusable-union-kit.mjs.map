<div class="popup-content">
  <span class="popup-icon" aria-hidden="true">{{ icon() }}</span>
  <span class="popup-message">{{ message() }}</span>
  <button type="button" class="popup-close" [attr.aria-label]="closeLabel()" (click)="closed.emit()">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
      <path d="M3 3l10 10M13 3L3 13" />
    </svg>
  </button>
</div>
