<label [for]="id()" [class.visually-hidden]="hideLabel()">{{ label() }}</label>
<div class="control">
  <input
    class="input"
    type="search"
    [id]="id()"
    [name]="name()"
    [value]="value()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    (input)="handleInput($event)"
    (keydown.enter)="$event.preventDefault(); submit()"
    (blur)="touch.emit()"
  />
  <button
    class="search-button"
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="buttonLabel()"
    (click)="submit()"
  >
    <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true" focusable="false">
      <path
        d="M11.8539 11.1464L8.86938 8.16189C9.68269 7.16719 10.0826 5.89794 9.9863 4.61667C9.89003 3.33541 9.30499 2.14016 8.35217 1.27815C7.39936 0.416146 6.15168 -0.0466629 4.8672 -0.014547C3.58273 0.0175689 2.35973 0.542153 1.45119 1.4507C0.542641 2.35924 0.0180572 3.58224 -0.0140587 4.86671C-0.0461746 6.15119 0.416635 7.39887 1.27864 8.35168C2.14064 9.3045 3.3359 9.88955 4.61716 9.98581C5.89843 10.0821 7.16768 9.6822 8.16238 8.86889L11.1469 11.8534C11.2412 11.9445 11.3675 11.9949 11.4986 11.9937C11.6297 11.9926 11.7551 11.94 11.8478 11.8473C11.9405 11.7546 11.9931 11.6292 11.9942 11.4981C11.9954 11.367 11.945 11.2407 11.8539 11.1464ZM5.00038 8.99989C4.20925 8.99989 3.4359 8.7653 2.7781 8.32577C2.1203 7.88624 1.60761 7.26153 1.30486 6.53063C1.00211 5.79972 0.922897 4.99545 1.07724 4.21953C1.23158 3.44361 1.61254 2.73087 2.17195 2.17146C2.73136 1.61205 3.44409 1.23109 4.22002 1.07675C4.99594 0.922409 5.80021 1.00162 6.53111 1.30437C7.26202 1.60712 7.88673 2.11981 8.32626 2.77761C8.76578 3.43541 9.00038 4.20877 9.00038 4.99989C8.99919 6.06039 8.57738 7.07712 7.82749 7.827C7.0776 8.57689 6.06088 8.9987 5.00038 8.99989Z"
      />
    </svg>
  </button>
</div>
