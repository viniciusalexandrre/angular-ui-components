<ui-field
  [id]="id()"
  [label]="label()"
  [hint]="hint()"
  [required]="required()"
  [errors]="displayedErrors()"
  [showErrors]="showErrors()"
>
  <div class="control">
    <input
      class="input"
      type="text"
      role="combobox"
      autocomplete="off"
      aria-autocomplete="list"
      [id]="id()"
      [name]="name()"
      [value]="searchTerm()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [attr.aria-expanded]="showPanel()"
      [attr.aria-controls]="listboxId()"
      [attr.aria-activedescendant]="activeDescendant()"
      [attr.aria-invalid]="showErrors()"
      [attr.aria-describedby]="describedBy()"
      (focus)="handleFocus()"
      (input)="onInput($any($event.target).value)"
      (keydown)="handleKeydown($event)"
      (blur)="handleBlur()"
    />

    @if (showPanel()) {
      <div class="panel">
        @switch (panelState()) {
          @case ('loading') {
            <span class="panel-message" role="status">{{ loadingText() }}</span>
          }
          @case ('error') {
            <span class="panel-message" role="alert">{{ loadError() }}</span>
          }
          @case ('empty') {
            <span class="panel-message" role="status">{{ emptyText() }}</span>
          }
          @default {
            <ul class="options" role="listbox" [id]="listboxId()" [attr.aria-label]="label()">
              @for (option of options(); track option.value; let i = $index) {
                <li
                  role="option"
                  [id]="optionId(i)"
                  [class.active]="i === activeIndex()"
                  [attr.aria-selected]="option.value === value()"
                  (mousedown)="$event.preventDefault()"
                  (click)="select(option)"
                >
                  {{ option.label }}
                </li>
              }
            </ul>
          }
        }
      </div>
    }
  </div>
</ui-field>
